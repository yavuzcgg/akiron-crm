services:
  postgres:
    image: postgres:17
    container_name: akiron-postgres
    environment:
      POSTGRES_DB: akiron
      POSTGRES_USER: akiron
      POSTGRES_PASSWORD: akiron_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akiron -d akiron"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
