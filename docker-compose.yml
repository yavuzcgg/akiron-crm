# Local development infrastructure. Ports are chosen not to collide with the other Akiron
# projects on the same machine (akiron-seo: 5432/3000, akiron-commerce: 5433).
name: akiron-crm

services:
  postgres:
    image: postgres:17
    container_name: akiron-crm-postgres
    environment:
      POSTGRES_DB: akiron
      POSTGRES_USER: akiron
      POSTGRES_PASSWORD: akiron_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akiron -d akiron"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub minio/minio is no longer published; Chainguard ships the same server.
    image: cgr.dev/chainguard/minio:latest
    container_name: akiron-crm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: akiron
      MINIO_ROOT_PASSWORD: akiron_dev_minio
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - miniodata:/data

  mailpit:
    # Catches every e-mail the API sends; read them at http://localhost:8026.
    image: axllent/mailpit:latest
    container_name: akiron-crm-mailpit
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  pgdata:
  miniodata:
